<!DOCTYPE html><html><head><meta charset="utf-8"><title>GI Hub V12.2</title><style>body{font-family:Segoe UI,Arial;margin:20px;background:#f5f7fa} .card{background:white;padding:12px;border-radius:10px;box-shadow:0 1px 4px #ccc;margin:8px} .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{font-size:28px;font-weight:bold}.section{margin-top:18px}.path{display:flex;gap:8px;flex-wrap:wrap}.path .card{min-width:120px;text-align:center}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} input{width:80px}.small{font-size:12px;color:#555} details{margin-top:10px}</style></head><body><h1>GI Hub Dashboard V12.2</h1><div class="card"><b>Editable Assumptions</b><div class="inputs">Mean Referrals <input id=r value=60 type=number> P25 <input id=p25 value=30 type=number> P95 <input id=p95 value=100 type=number> Utilisation % <input id=u value=85 type=number> Wrong % <input id=w value=9 type=number> A&G % <input id=ag value=15 type=number> Surg % <input id=s value=3 type=number> Liver % <input id=l value=17 type=number> DTT % <input id=d value=9 type=number> FU Opt <input id=fo value=0.3 step=0.01> FU Exp <input id=fe value=0.45 step=0.01> FU Pess <input id=fp value=0.6 step=0.01> Runs <input id=runs value=1000 type=number></div><button onclick='calc()'>Recalculate</button></div><div class='grid section'><div class='card'><div>F2F</div><div id=f2f class=kpi></div></div><div class='card'><div>Follow-ups</div><div id=fu class=kpi></div></div><div class='card'><div>Contacts</div><div id=contacts class=kpi></div></div><div class='card'><div>Required Capacity</div><div id=cap class=kpi></div></div><div class='card'><div>Total WTE</div><div id=wte class=kpi></div></div><div class='card'><div>24h Decision %</div><div id=d24 class=kpi></div></div><div class='card'><div>48h Contact %</div><div id=c48 class=kpi></div></div><div class='card'><div>Peak Util (P95)</div><div id=peak class=kpi></div></div></div><div class='section'><div class='path' id='path'></div></div><details><summary>Maths & Explain This Number</summary><div id=math></div></details><script>function calc(){let r=+rEl.value;let wrong=+w.value,agv=+ag.value,sv=+s.value,lv=+l.value,dv=+d.value;let hub=100-wrong-agv-sv-lv-dv;if(hub<0) hub=0;let f2f=r*hub/100;let fur=(+fo.value + +fe.value + +fp.value)/3;let fu=f2f*fur;let contacts=f2f+fu;let cap=contacts/(+u.value/100);let twte=cap*0.015;document.getElementById('f2f').innerText=f2f.toFixed(1);document.getElementById('fu').innerText=fu.toFixed(1);document.getElementById('contacts').innerText=contacts.toFixed(1);document.getElementById('cap').innerText=cap.toFixed(1);document.getElementById('wte').innerText=twte.toFixed(2); let peak=0,sum=0,d24=0,c48=0;let runsN=+runs.value;for(let i=0;i<runsN;i++){let rr=Math.max(0,r+(Math.random()-0.5)*(+p95.value-+p25.value));let util=((rr*(hub/100)*(1+fur))/cap)*100;sum+=util;if(util<85)d24++; if(util<90)c48++; if(util>peak)peak=util;} document.getElementById('peak').innerText=peak.toFixed(0)+'%';document.getElementById('d24').innerText=(d24/runsN*100).toFixed(0)+'%';document.getElementById('c48').innerText=(c48/runsN*100).toFixed(0)+'%';document.getElementById('path').innerHTML=`<div class=card>Referrals<br><b>${r}</b></div><div class=card>Wrong<br>${(r*wrong/100).toFixed(1)}</div><div class=card>A&G<br>${(r*agv/100).toFixed(1)}</div><div class=card>Surgical<br>${(r*sv/100).toFixed(1)}</div><div class=card>Liver<br>${(r*lv/100).toFixed(1)}</div><div class=card>DTT<br>${(r*dv/100).toFixed(1)}</div><div class=card>Assessment Hub<br>${f2f.toFixed(1)}</div>`; document.getElementById('math').innerHTML=`Assessment Hub % = 100 - pathways = ${hub.toFixed(1)}%<br>F2F=${r}×${hub.toFixed(1)}%=${f2f.toFixed(1)}<br>Follow-ups=${f2f.toFixed(1)}×${fur.toFixed(2)}=${fu.toFixed(1)}<br>Contacts=${contacts.toFixed(1)}<br>Required Capacity=${contacts.toFixed(1)}/(${u.value}% )=${cap.toFixed(1)}`;} const rEl=document.getElementById('r'); calc();</script></body></html>
